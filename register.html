<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daftar Akaun Guru</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f8f2;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.register-box {
    background: white;
    width: 90%;
    max-width: 420px;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    border-top: 5px solid #f4c430;
}

h1 {
    color: #176b3a;
    text-align: center;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 12px;
    border: none;
    border-radius: 7px;
    background: #176b3a;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #12562f;
}

#message {
    text-align: center;
    margin-top: 15px;
    color: #555;
}
</style>
</head>

<body>

<div class="register-box">

    <h1>Daftar Akaun Guru</h1>

    <label>First Name</label>
    <input type="text" id="firstName" placeholder="Contoh: Farhana">

    <label>Last Name</label>
    <input type="text" id="lastName" placeholder="Contoh: Jamil">

    <label>Nama Sekolah</label>
<input type="text" id="school" placeholder="Contoh: SMK Tinggi Batu Pahat">
    
    <label>Email</label>
    <input type="email" id="email" placeholder="Email guru">

    <label>Password</label>
    <input type="password" id="password" placeholder="Password">

    <button onclick="register()">
        Daftar Akaun
    </button>

    <div id="message"></div>

<a href="login.html" style="
    display: block;
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    border-radius: 7px;
    background: #f4c430;
    color: #176b3a;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
    box-sizing: border-box;
">
    Log Masuk
</a>

</div>

<script>

const SUPABASE_URL =
    "https://edrbpbinutswlxislomo.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_0e-OOVhhhthMf5yC28QTHw_vYTmWbQa";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function register() {

    const firstName =
        document.getElementById("firstName").value.trim();

    const lastName =
        document.getElementById("lastName").value.trim();

    const school =
        document.getElementById("school").value.trim();
    
    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    if (!firstName || !lastName || !school || !email || !password) {

        message.textContent =
            "Sila lengkapkan semua maklumat.";

        return;
    }


    message.textContent =
        "Sedang mendaftarkan akaun...";


    const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {

    first_name: firstName,

    last_name: lastName,

    school_name: school


                }

            }

        });


    if (error) {

        message.textContent =
            error.message;

        return;
    }


    message.textContent =
        "Akaun berjaya didaftarkan. Sila login.";

}

</script>

</body>
</html>
