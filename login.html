<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Portal Sekolah</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.login-box {
    background: white;
    width: 350px;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 8px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 25px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

#error {
    color: red;
    text-align: center;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>Portal Sekolah</h1>

    <div class="subtitle">
        Log masuk untuk meneruskan
    </div>

    <label>Email Guru</label>
    <input type="email" id="email" placeholder="contoh@sekolah.edu.my">

    <label>Password</label>
    <input type="password" id="password" placeholder="Masukkan password">

    <button onclick="login()">Log Masuk</button>

    <div id="error"></div>

</div>

<script>
function login() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (email === "guru@sekolah.com" && password === "123456") {

        window.location.href = "index.html";

    } else {

        document.getElementById("error").innerText =
        "Email atau password tidak betul.";

    }
}
</script>

</body>
</html>
