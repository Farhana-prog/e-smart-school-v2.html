<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Guru - Portal Sekolah</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 320px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #333;
      color: white;
      font-size: 16px;
    }

    button:hover {
      opacity: 0.9;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #d00;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>Portal Sekolah</h2>

    <input type="email" id="email" placeholder="Email guru">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Log Masuk</button>

<div id="message"></div>

<p style="text-align: center; margin-top: 15px;">
    Belum ada akaun?
    <a href="register.html" style="color: #176b3a; font-weight: bold;">
        Daftar Akaun Guru
    </a>
</p>
  </div>

  <script>
    const SUPABASE_URL = "https://edrbpbinutswlxislomo.supabase.co";

    const SUPABASE_KEY = "sb_publishable_0e-OOVhhhthMf5yC28QTHw_vYTmWbQa";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      message.textContent = "Sedang log masuk...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
  message.textContent = "Email atau password tidak betul.";
  return;
}


window.location.href = "dashboard.html";
    }
  </script>

</body>
</html>
